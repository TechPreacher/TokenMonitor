# project.yml
name: TokenMonitor
options:
  bundleIdPrefix: com.corti
  deploymentTarget:
    macOS: "15.0"
packages:
  TokenMonitorKit:
    path: TokenMonitorKit
targets:
  TokenMonitor:
    type: application
    platform: macOS
    sources: [App/Sources, App/Assets.xcassets]
    dependencies:
      - package: TokenMonitorKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: true            # menu-bar only, no Dock icon
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.corti.TokenMonitor
        MARKETING_VERSION: "1.1.1"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "6.0"
        ENABLE_APP_SANDBOX: false                  # needs ~/.claude + other app's keychain item
        DEVELOPMENT_TEAM: M9Y77E7ZX5
        ENABLE_HARDENED_RUNTIME: true              # required for notarization
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"  # notarizable distribution signing
          OTHER_CODE_SIGN_FLAGS: "--timestamp"            # secure timestamp for notarization
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false       # no get-task-allow debug entitlement
  TokenMonitorAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [App/Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        DEVELOPMENT_TEAM: M9Y77E7ZX5               # must match app target or dlopen rejects bundle
        CODE_SIGN_IDENTITY: "Apple Development"
    dependencies:
      - target: TokenMonitor
schemes:
  TokenMonitor:
    build:
      targets:
        TokenMonitor: all
    test:
      targets: [TokenMonitorAppTests]
